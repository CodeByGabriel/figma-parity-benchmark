# Gabarito das variantes do agency (Preline UI). Mesma convencao do dashboard:
# on_axis = categoria(s) que DEVEM virar mismatch; `missing` nao e categoria de
# mismatch; dai on_axis=[] no component_gross.

[v0]
on_axis = []
expected_status = "matched"
affected = "nenhum (par publicado; ver README sobre divergencias reais)"

[color_gross]
on_axis = ["color"]
expected_status = "mismatch"
affected = "Botao 'Request demo' do header (token bg-primary -> magenta #d81b8c)"

[layout_gross]
on_axis = ["layout"]
expected_status = "mismatch"
affected = "Faixa de logos de clientes (linha horizontal -> coluna empilhada)"

[alignment_gross]
on_axis = ["alignment"]
expected_status = "mismatch"
affected = "Container do hero (mx-auto removido -> conteudo cola a esquerda)"

[component_gross]
on_axis = []
expected_status = "missing"
affected = "Secao Testimonials inteira (citacao + imagem) removida do DOM"

[image_gross]
on_axis = ["image"]
expected_status = "mismatch"
affected = "Avatar da secao Stats (size-8 quadrado -> h-8 w-16 esticado)"

[text_gross]
on_axis = ["text"]
expected_status = "mismatch"
affected = "Titulo 'We're hiring' no rodape do Contact (base -> text-3xl)"
